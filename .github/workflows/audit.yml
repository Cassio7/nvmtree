name: Security audit

# Checks every crate in Cargo.lock against the RustSec advisory database.
# Runs weekly (advisories appear even when our code doesn't change) and
# whenever dependencies change.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - run: cargo audit
